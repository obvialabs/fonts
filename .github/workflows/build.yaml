# Workflow name
name: Build font and specimen

# Workflow conditions
on:
  # Allow manual trigger from GitHub Actions UI
  workflow_dispatch:
  # Run on pull requests
  pull_request:
  push:
    # Run on pushes to main branch
    branches:
      - main
    # Run on pushes to tags
    tags:
      - '*'

# Grant write permissions to all scopes
permissions: write-all

# Ensure only one workflow runs per ref at a time
concurrency: ${{ github.workflow }}-${{ github.ref }}

# Workflow jobs
jobs:
  # Job (Build)
  build:
    # Job name shown in GitHub Actions UI
    name: Build and test
    # Runner environment (Ubuntu)
    runs-on: ubuntu-latest
    # Job steps
    steps:
      # Checkout the repository code
      - uses: actions/checkout@v6
      # Set up Python environment (version 3.11)
      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      # Install and configure fontspector for font QA checks
      - name: Setup fontspector
        uses: fonttools/setup-fontspector@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Install required system packages and tools
      - name: Install toolset
        run: |
          sudo apt-get update
          sudo apt-get install ttfautohint libcairo2-dev python3-cairo-dev pkg-config python3-dev
          sudo snap install yq
      # Define artifact file name explicitly
      - name: Set artifact file name
        id: zip-name
        shell: bash
        run: echo "ZIP_NAME=obvia-font" >> $GITHUB_ENV
      # Build font files using Makefile
      - name: Build font
        run: make build
      # Run fontspector tests (non-blocking if errors occur)
      - name: Check with fontspector
        run: make test
        continue-on-error: true
      # Generate specimen proofs for fonts
      - name: Generate proofs
        run: make proof
      # Prepare test result site by copying index.html
      - name: Set up test result site
        run: cp docs/page/index.html output/index.html
      # Upload site artifacts for GitHub Pages deployment (only on main branch)
      - name: Collect deployment assets
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./output
      # Archive build artifacts (fonts and output directory)
      - name: Archive artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: |
            fonts
            output
      # Archive npm release artifacts for later publishing
      - name: Archive npm release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: obvia-font-fonts-npm
          path: |
            obvia-font.zip
            packages/fonts/dist/fonts

    # Job outputs (used by other jobs)
    outputs:
      zip_name: ${{ env.ZIP_NAME }}

  # Workflow (Deploy)
  deploy:
    # Job name shown in GitHub Actions UI
    name: Deploy results to pages
    # Job condition: only run when pushing to the main branch
    if: ${{ github.ref == 'refs/heads/main' }}
    # This job depends on the successful completion of the build job
    needs: build
    # Runner environment (Ubuntu)
    runs-on: ubuntu-latest
    # Job permissions required for deployment
    permissions:
      pages: write        # Allow writing to GitHub Pages
      id-token: write     # Allow OIDC token for authentication
    # Job environment configuration
    environment:
      name: github-pages  # Target environment is GitHub Pages
      url: ${{ steps.deployment.outputs.page_url }} # URL of deployed site
    # Job steps
    steps:
      # Deploy artifacts to GitHub Pages using official action
      - name: Deploy to pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Workflow (Release)
  release:
    # Job name shown in GitHub Actions UI
    name: Release bundle
    # Job condition: only run when a tag is pushed
    if: contains(github.ref, 'refs/tags/')
    # This job depends on the successful completion of the build job
    needs: build
    # Runner environment
    runs-on: ubuntu-latest
    # Environment variables used in this job
    env:
      ZIP_NAME: ${{ needs.build.outputs.zip_name }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    # Job steps
    steps:
      # Checkout the repository code
      - uses: actions/checkout@v6
      # Download font artifacts produced by the build job
      - name: Use font artifacts from CI
        uses: actions/download-artifact@v5
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}
      # Copy documentation article into the release directory (optional)
      - name: Copy article to release directory
        run: cp docs/page/index.html ${{ env.ZIP_NAME }}/ARTICLE.en_us.html || true
      # Copy license file (OFL.txt) into the release directory
      - name: Copy license file to release directory
        run: cp OFL.txt ${{ env.ZIP_NAME }}/OFL.txt
      # Remove proof/test outputs from the release bundle
      - name: Remove proof/test outputs from release
        run: rm -rf ${{ env.ZIP_NAME }}/output
      # Set release file name based on repository and tag name
      - name: Set release file name
        shell: bash
        run: echo "RELEASE_ZIP_NAME=obvia-font-${{ github.ref_name }}" >> $GITHUB_ENV
      # Create the release bundle by renaming and zipping artifacts
      - name: Create release bundle
        run: mv ${{ env.ZIP_NAME }} ${{ env.RELEASE_ZIP_NAME }}; zip -r ${{ env.RELEASE_ZIP_NAME }}.zip ${{ env.RELEASE_ZIP_NAME }}
      # Check if a GitHub release already exists, create one if not
      - name: Check for release
        id: create_release
        run: |
          if ! gh release view ${{ github.ref_name }}; then
            git show -s --format=%B ${{ github.ref_name }} | tail -n +4 | gh release create ${{ github.ref_name }} -t ${{ github.ref_name }} -F -
          fi
      # Upload the release bundle zip file to the GitHub release
      - name: Populate release
        run: gh release upload ${{ github.ref_name }} ${{ env.RELEASE_ZIP_NAME }}.zip --clobber
      # Mark the release as live (remove draft status)
      - name: Set release live
        run: gh release edit ${{ github.ref_name }} --draft=false

  # Workflow (NPM)
  release-npm:
    # Job name shown in GitHub Actions UI
    name: Release packages
    # This job depends on the successful completion of the build job
    needs: build
    # Only run this job when pushing to the main branch
    if: github.ref == 'refs/heads/main'
    # Job OS (runner environment)
    runs-on: ubuntu-latest
    # Job steps
    steps:
      # Checkout the repository code with full history
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Download npm artifacts produced by the build job
      - name: Download npm artifacts
        uses: actions/download-artifact@v5
        with:
          name: obvia-font-fonts-npm
          path: ./artifacts

      # Set up Node.js environment using version from .nvmrc
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # Install a specific version of corepack globally
      - name: 'Install corepack@0.31'
        run: npm install -g corepack@0.31

      # Enable corepack to manage package managers like pnpm
      - name: Enable Corepack
        run: corepack enable

      # Configure npm authentication using secret token
      - name: Configure npm auth
        run: npm config set //registry.npmjs.org/:_authToken="${NPM_TOKEN}"
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Install project dependencies with pnpm
      - name: Install dependencies
        working-directory: packages/fonts
        run: pnpm install --frozen-lockfile

      # Move built font files from artifacts into the npm package directory
      - name: Move the font files for npm from build artifacts to the npm package
        run: |
          rm -rf packages/fonts/dist/fonts
          mv artifacts/packages/fonts/dist/fonts packages/fonts/dist/fonts

      # Use changesets to either create a release PR or publish packages
      - name: Create release pull request or publish
        id: changesets
        uses: changesets/action@v1.4.10
        with:
          publish: pnpm run release
          version: pnpm run version
          cwd: packages/fonts
          title: "changesets: update versions of packages for release"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Upload the font zip to the corresponding GitHub Release if published
      - name: Upload font zip to release
        if: steps.changesets.outputs.published == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(jq -r '.version' packages/fonts/package.json)
          mv artifacts/obvia-font.zip "obvia-font-v$VERSION.zip"
          gh release upload "obvia@$VERSION" "obvia-font-v$VERSION.zip" --clobber
