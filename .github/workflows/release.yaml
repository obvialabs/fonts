name: Stage npm Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version already committed in packages/fonts/package.json (for example 1.4.0)"
        required: true
        type: string

concurrency:
  group: npm-stage
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  stage:
    name: Verify and stage @obvia/fonts
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: npm-staging

    steps:
      - name: Checkout dispatch commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: latest-known
          python-version: "3.11"
          enable-cache: false

      - name: Install system font tooling
        run: |
          sudo apt-get update
          sudo apt-get install --yes ttfautohint libcairo2-dev python3-cairo-dev pkg-config python3-dev

      - name: Install Fontspector
        uses: fonttools/setup-fontspector@d53404291dc78a5a41cf76ea48e1d13a731fb812
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install staged-publishing npm CLI
        run: npm install --global npm@11.20.0

      - name: Verify release metadata
        run: >-
          uv run --no-project --python 3.11 --with-requirements requirements.txt
          python scripts/verify-release.py --version "${{ inputs.version }}"

      - name: Build, run full QA, and create exact npm tarball
        run: make package

      - name: Verify staged publishing support
        run: |
          test "$(node --version)" = "v24.12.0"
          npm --version
          npm stage --help >/dev/null

      - name: Stage exact tested tarball on npm
        env:
          NPM_CONFIG_IGNORE_SCRIPTS: "true"
        shell: bash
        run: |
          mapfile -t TARBALLS < <(find output/npm -maxdepth 1 -type f -name '*.tgz' -print)
          test "${#TARBALLS[@]}" -eq 1
          npm stage publish "${TARBALLS[0]}" --access public

      - name: Upload exact staged artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: obvia-font-release-${{ inputs.version }}-${{ github.sha }}
          if-no-files-found: error
          path: |
            output/build-manifest.json
            output/fontspector/
            output/release/obvia-font.zip
            output/npm/*.tgz
            output/npm/*.sha256
